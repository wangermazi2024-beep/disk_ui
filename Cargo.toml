[package]
name = "disk_ui"
version = "0.2.0"
edition = "2024"
description = "DiskForge WMS — NTFS 磁盘空间分析器"
authors = ["WMS"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd"]

[dependencies]
egui = "0.35"
egui_extras = { version = "0.35", optional = true }
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts"], optional = true }
dashmap = "6"
rfd = { version = "0.17", optional = true }
# 重复文件内容比对用：BLAKE3 做局部哈希预筛（SIMD 加速、非加密哈希里数一数二快，
# fddf/fclones 这些主流开源去重工具的做法），SHA-256 做最终确认（慢一些，但
# 换来的是能直接用 PowerShell 自带的 `Get-FileHash` 或 `certutil -hashfile`
# 交叉核对结果，不用额外装工具——这是特意的取舍，见 dedup.rs 顶部注释）。
blake3 = "1"
sha2 = "0.10"
# 统一日志：log 是 Rust 生态里用得最多的日志门面，见 applog.rs 顶部注释。
log = "0.4"
# 日志时间戳用；标准库没有日历换算，手搓容易出 bug，chrono 是这个生态里
# 最常用、最经过考验的时间库。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "disk_ui"
path = "src/main.rs"
required-features = ["gui"]
