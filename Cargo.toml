[package]
name = "disk_ui"
version = "0.2.0"
edition = "2024"
description = "DiskForge WMS — NTFS 磁盘空间分析器"
authors = ["WMS"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd"]

[dependencies]
egui = "0.35"
egui_extras = { version = "0.35", optional = true }
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts"], optional = true }
dashmap = "6"
rfd = { version = "0.17", optional = true }
# 重复文件内容比对用：BLAKE3 做局部哈希预筛和全文件最终确认（SIMD 加速，
# 非加密哈希里数一数二快，fddf/fclones/yadf 这些主流开源去重工具的常见选择，
# 见 dedup.rs 顶部注释——原来最终确认单独用较慢的 SHA-256 是为了能被系统
# 自带工具核对，但实测在高重复率数据集上这个选择直接拖慢了几倍总耗时，
# 权衡下改成全程用 BLAKE3，需要核对某个具体文件时用 BLAKE3 官方的 `b3sum`
# 工具或者手动抽查即可，不需要为了小概率用得上的场景牺牲默认速度）。
blake3 = "1"
# 统一日志：log 是 Rust 生态里用得最多的日志门面，见 applog.rs 顶部注释。
log = "0.4"
# 日志时间戳用；标准库没有日历换算，手搓容易出 bug，chrono 是这个生态里
# 最常用、最经过考验的时间库。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    # 检测"文件/文件夹被哪个进程占用"用的是 Windows 官方的 Restart Manager
    # API（资源管理器"文件正在使用"弹窗、Windows Installer 更新前检测占用，
    # 用的都是同一套 API），见 file_ops.rs 顶部注释。
    "Win32_System_RestartManager",
    # "结束进程"用 Win32_System_Threading 里的 OpenProcess/TerminateProcess
    # （已经在下面列了）；"停止服务"需要单独的服务控制管理器 API。
    "Win32_System_Services",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "disk_ui"
path = "src/main.rs"
required-features = ["gui"]
