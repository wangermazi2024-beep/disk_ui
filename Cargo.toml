[package]
name = "disk_ui"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.35"
egui_extras = "0.35"
rand = "0.8"

# 仅 Windows 平台需要：直接读取 NTFS $MFT 的底层 API 绑定。
# （FSCTL_GET_NTFS_VOLUME_DATA / CreateFileW / DeviceIoControl / 权限检测等）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Threading",
] }
